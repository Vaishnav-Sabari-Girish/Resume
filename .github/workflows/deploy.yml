name: Build and Deploy Resume
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Typst
        uses: typst-community/setup-typst@v5.1.0
      - name: Install Fonts
        run: |
            mkdir -p ~/.local/share/fonts

    # Source Sans 3 — from Adobe's official repo
            wget -q "https://github.com/adobe-fonts/source-sans/raw/release/TTF/SourceSans3-Regular.ttf" -O ~/.local/share/fonts/SourceSans3-Regular.ttf
            wget -q "https://github.com/adobe-fonts/source-sans/raw/release/TTF/SourceSans3-Bold.ttf" -O ~/.local/share/fonts/SourceSans3-Bold.ttf
            wget -q "https://github.com/adobe-fonts/source-sans/raw/release/TTF/SourceSans3-It.ttf" -O ~/.local/share/fonts/SourceSans3-It.ttf

    # Roboto — via apt
            sudo apt-get install -y fonts-roboto

    # Font Awesome 6 Free — from official FA repo
            wget -q "https://github.com/FortAwesome/Font-Awesome/raw/6.x/webfonts/fa-regular-400.ttf" -O ~/.local/share/fonts/fa-regular-400.ttf
            wget -q "https://github.com/FortAwesome/Font-Awesome/raw/6.x/webfonts/fa-solid-900.ttf" -O ~/.local/share/fonts/fa-solid-900.ttf
            wget -q "https://github.com/FortAwesome/Font-Awesome/raw/6.x/webfonts/fa-brands-400.ttf" -O ~/.local/share/fonts/fa-brands-400.ttf

            fc-cache -fv
      - name: Compile CV to PDF
        run: typst compile main.typ resume.pdf
      - name: Create output directory
        run: mkdir -p _site
      - name: Copy PDF to output
        run: cp resume.pdf _site/resume.pdf
      - name: Create redirect index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=resume.pdf" />
              <title>Vaishnav's Resume</title>
            </head>
            <body>
              <p>Redirecting to resume... <a href="resume.pdf">Click here</a> if not redirected.</p>
            </body>
          </html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
