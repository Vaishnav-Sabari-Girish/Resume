name: Build and Deploy Resume

on:
  push:
    branches: [main]   # or master, whatever your default branch is
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v5.1.0

      - name: Compile CV to PDF
        run: typst compile main.typ resume.pdf
        # Change main.typ to your actual entry file name if different

      - name: Create output directory
        run: mkdir -p _site

      - name: Copy PDF to output
        run: cp resume.pdf _site/resume.pdf

      - name: Create redirect index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=resume.pdf" />
              <title>Vaishnav's Resume</title>
            </head>
            <body>
              <p>Redirecting to resume... <a href="resume.pdf">Click here</a> if not redirected.</p>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
